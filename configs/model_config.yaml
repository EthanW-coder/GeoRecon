backbone:
  config: configs/inference_512_v1.0.yaml

model:
  vae_latent_channels: 4
  vae_scale_factor: 8
  unet_in_channels: 4
  render_channels: 4
  depth_channels: 1
  clip_embed_dim: 1024
  camera_embed_dim: 256
  num_frames: 25
  condition_dropout: 0.1

training:
  optimizer: Adam
  learning_rate: 1.0e-5
  global_batch_size: 8
  stages:
    - height: 320
      width: 512
      steps: 50000
    - height: 576
      width: 1024
      steps: 5000

inference:
  height: 512
  width: 512
  ddim_steps: 50
  ddim_eta: 1.0
  unconditional_guidance_scale: 7.5
